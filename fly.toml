# fly.toml app configuration file generated for flowprobe on 2026-05-19T07:12:21-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flowprobe'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'flowprobe_flows'
  destination = '/app/flows'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1    # never sleep — in-memory jobs are lost on shutdown

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
