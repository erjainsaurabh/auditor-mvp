flows:
- id: flow_suite_2d61389a_7dcf_4ac0_b74b_ff3380d12189
  test_conditions:
  - id: tc_069
    sequence: 1
    goal: Ivalua extranet
    execution:
      navigation: http://project.ivalua.com
      navigation_mode: fresh
    steps:
    - id: f69a7349-edd6-4dde-a781-1a22ad3c00fe
      sequence: 1
      description: Go to the Ivalua Extranet Site
      type: transition
      expected: extranet credentials page is displayed
      hints:
      - navigate('base_url')
      - read_page()
    - id: 8067d41d-5fc7-44a1-b7e8-d64282402d24
      sequence: 2
      description: Login to the application with
      type: transition
      expected: extranet home page should be displayed
      data:
        User: '{{User}}'
        Password: '{{Password}}'
      hints:
      - fill_field('User', '{{User}}')
      - fill_field('Password', '{{Password}}')
      - click('Login')
    - id: 29748b9a
      sequence: 3
      description: Use top menu to go to the requests browse page
      type: transition
      expected: after clicking the top menu navigation page, you will land on the request manage page which will contain various
        search options to manage the requests.
      hints:
      - use top navigation menu for the navigation
      - browse page url - https://project.ivalua.com/page/prj/req_browse#
    - id: 98fcedd0-f53d-4af8-8cdf-4c9d15872a3c
      sequence: 4
      description: 'Search for campaign and select for two campaigns in associated combo list '
      type: transition
      expected: make sure both the campaigns are selected in terms combo box
      data:
        campaign1: '{{campaign1}}'
        campaign2: '{{campaign2}}'
      hints:
      - 'look for "Campaign" div and its associated combobox '
      - in the combo box type first campaign mentioned in the data and press enter
      - then in the same combo box type second campaign mentioned in the data and press enter
      - then click on the search button
      - HTML code for finding out campaign test --- <div class="grid-cell" style="grid-column:1;grid-row:1">Campaign</div>
      - 'HTML code for finding out the select box --- <span class="select2 select2-container select2-container--default select2-container--below"
        dir="ltr" data-select2-id="33"><span class="selection"><span class="select2-selection select2-selection--multiple"
        role="combobox" aria-haspopup="true" aria-expanded="false" tabindex="-1" aria-disabled="false"><ul class="select2-selection__rendered"><li
        class="select2-search select2-search--inline"><input class="select2-search__field" type="search" tabindex="0" autocomplete="off"
        autocorrect="off" autocapitalize="none" spellcheck="false" role="searchbox" aria-autocomplete="list" placeholder="--"
        style="width: 29px;"></li></ul></span></span><span class="dropdown-wrapper" aria-hidden="true"></span></span>'
      - selector field is part of the sibling div of campaign div mentioned above. use select2 or select2-container or combo
        role for finding out the element
      - if selector is not expended ie. aria-expanded="false" then click the selector to make sure it is expended so that
        other fields are visible for output search
      - '''The Campaign filter widget has this HTML: <span class="select2-container" data-select2-id="33"><input class="select2-search__field"
        role="searchbox"></span>'' '
      - 'REQUIRED: call select_filter with container_attribute="data-select2-id=33" -this is the unique attribute identifying
        the Campaign widget'''
      - call select_filter(filter_label="Campaign", option_value={{campaign1}}, container_attribute="data-select2-id=33")
      - 'call select_filter(filter_label="Campaign", option_value={{campaign2}}, container_attribute="data-select2-id=33")   '
    - id: 9ffb711d
      sequence: 5
      description: Deselect the defect resolutions on the filter plane
      type: transition
      expected: None of the defect's resolution/status related check box is checked
      hints:
      - click('id=filter[data_id_resolution]_checkall')
      - click('Search')
    - id: f7665589-0e9d-4472-8c2e-617af70721f1
      sequence: 6
      description: click excel extract button to download all the requests.
      type: transition
      expected: all the defect requests are downloaded
      hints:
      - use tool to download_file('Excel Extract')
      produces:
        type: defects_excel
