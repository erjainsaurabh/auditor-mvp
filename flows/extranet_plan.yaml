flows:
- id: flow_extranet
  description: dsdsds
  test_conditions:
  - id: tc_069
    sequence: 1
    goal: Ivalua extranet
    execution:
      navigation: http://project.ivalua.com
      navigation_mode: fresh
    steps:
    - id: f69a7349-edd6-4dde-a781-1a22ad3c00fe
      sequence: 1
      description: Go to the Ivalua Extranet Site
      type: transition
      expected: ''
      hints:
      - navigate('base_url')
      - read_page()
    - id: 8067d41d-5fc7-44a1-b7e8-d64282402d24
      sequence: 2
      description: Login to the application with
      type: transition
      expected: extranet home page should be displayed
      data:
        User: '{{User}}'
        Password: '{{Password}}'
      hints:
      - fill_field('User', '{{User}}')
      - fill_field('Password', '{{Password}}')
      - click('Login')
    - id: 29748b9a
      sequence: 3
      description: go to the top navigation and go for requests and select requests from the dropdown
      type: transition
      expected: defects/requests should be visible
    - id: 98fcedd0-f53d-4af8-8cdf-4c9d15872a3c
      sequence: 4
      description: 'Search for campaign and select for two campaigns from the list '
      type: transition
      expected: ''
      data:
        campaign1: '{{campaign1}}'
        campaign2: '{{campaign2}}'
      hints:
      - look for "Campaign" and its associated dropdown
      - click('{{campaign1}}')
      - click('{{campaign2}}')
    - id: f7665589-0e9d-4472-8c2e-617af70721f1
      sequence: 5
      description: looks for excel extract button to download all the requests.
      type: transition
      expected: make sure that new file is generated with the defects.
      hints:
      - read_page()
      - click('Excel Extract')
      - read_page()
