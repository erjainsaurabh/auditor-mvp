services:
  flowprobe:
    build: .
    restart: always
    ports:
      - "0.0.0.0:8081:8000"
    env_file:
      - .env
    environment:
      - FLOWPROBE_HEADLESS=true
    volumes:
      - /data/flowprobe/flows:/app/flows
      - /data/flowprobe/evidence:/app/evidence
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
