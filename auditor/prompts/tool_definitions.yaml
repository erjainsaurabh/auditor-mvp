- type: function
  function:
    name: navigate
    description: "Go to a URL path (e.g. '/login') or full URL"
    parameters:
      type: object
      properties:
        target:
          type: string
      required:
        - target

- type: function
  function:
    name: read_page
    description: "Get a semantic summary of the current page (fields, buttons, errors, headings)"
    parameters:
      type: object
      properties: {}

- type: function
  function:
    name: click
    description: "Click an element identified by its visible text"
    parameters:
      type: object
      properties:
        element_description:
          type: string
      required:
        - element_description

- type: function
  function:
    name: fill_field
    description: "Type a value into a form field identified by its label"
    parameters:
      type: object
      properties:
        field_label:
          type: string
        value:
          type: string
      required:
        - field_label
        - value

- type: function
  function:
    name: clear_field
    description: "Clear a form field identified by its label"
    parameters:
      type: object
      properties:
        field_label:
          type: string
      required:
        - field_label

- type: function
  function:
    name: submit_form
    description: "Submit the current form"
    parameters:
      type: object
      properties: {}

- type: function
  function:
    name: get_field_options
    description: "Get all available options in a dropdown or select field"
    parameters:
      type: object
      properties:
        field_label:
          type: string
      required:
        - field_label

- type: function
  function:
    name: select_option
    description: "Select a value in a dropdown, <select>, or combobox field. Use this instead of click/fill_field when the aria snapshot shows role=combobox or role=listbox."
    parameters:
      type: object
      properties:
        field_label:
          type: string
          description: "Label of the dropdown field"
        option_value:
          type: string
          description: "The option text or value to select"
      required:
        - field_label
        - option_value

- type: function
  function:
    name: hover
    description: "Hover over an element to reveal CSS dropdowns or submenus, then call read_page to see the revealed options"
    parameters:
      type: object
      properties:
        element_description:
          type: string
      required:
        - element_description

- type: function
  function:
    name: press_key
    description: "Press a keyboard key (e.g. 'Escape' to close a calendar/dropdown, 'Tab' to move focus, 'Enter' to confirm). Use Escape after filling a date field to dismiss the calendar picker."
    parameters:
      type: object
      properties:
        key:
          type: string
          description: "Key name: Escape, Tab, Enter, ArrowDown, etc."
      required:
        - key

- type: function
  function:
    name: download_file
    description: "Click a button or link that triggers a file download (Excel, CSV, PDF) and wait for the download to complete. Returns a token (e.g. 'downloaded_file_1') that upload_file can use to reference the file in a later step."
    parameters:
      type: object
      properties:
        element_description:
          type: string
          description: "Visible label of the button or link that triggers the download (e.g. 'Export to Excel', 'Generate Report')"
      required:
        - element_description

- type: function
  function:
    name: upload_file
    description: "Upload a file to a file-input field or drop zone. Use file_ref to pass either a token from download_file (e.g. 'downloaded_file_1') or a fixture file path (e.g. 'fixtures/sample.xlsx')."
    parameters:
      type: object
      properties:
        field_label:
          type: string
          description: "Label of the file input field or drop zone (e.g. 'Import Defects', 'Attach File')"
        file_ref:
          type: string
          description: "Token returned by download_file (e.g. 'downloaded_file_1') or a path to a fixture file"
      required:
        - field_label
        - file_ref

- type: function
  function:
    name: take_screenshot
    description: "Capture a screenshot as evidence with a descriptive label"
    parameters:
      type: object
      properties:
        label:
          type: string
      required:
        - label

- type: function
  function:
    name: verify_claim
    description: "Record the final verdict for the current claim"
    parameters:
      type: object
      properties:
        verdict:
          type: string
          enum:
            - verified
            - failed
            - blocked
            - unverifiable
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
        reasoning:
          type: string
      required:
        - verdict
        - confidence
        - reasoning
