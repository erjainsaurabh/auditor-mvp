flows:
- id: flow_login
  description: Authenticate to the application — shared prerequisite for all flows
  test_conditions:
  - id: tc_login
    goal: Log in with valid credentials and confirm home page loads
    execution:
      navigation: Home
    steps:
    - id: step_001
      description: Login succeeds and the home page loads with main navigation
      type: transition
      expected: the home page loads showing a main navigation menu with items such as Requisition, Contracts, Vendors, or
        similar
      data:
        app_username: '{{app_username}}'
        app_password: '{{app_password}}'
- id: flow_requisition_creation
  description: Create a new Sourcing Requisition end-to-end
  depends_on:
  - flow_login
  test_conditions:
  - id: tc_001
    goal: Verify Sourcing Requisition creation is accessible from the main navigation
    execution:
      navigation: Home
    steps:
    - id: step_002
      description: Requisition menu item is visible in the main navigation
      type: existence
      expected: a menu item labelled 'Requisition' is visible in the top navigation bar
    - id: step_003
      description: Clicking the Requisition menu item opens a dropdown with a Browse Requisitions link
      type: behavioral
      expected: clicking the Requisition menu item opens a dropdown showing a 'Browse Requisitions' link
      depends_on:
      - step_002
    - id: step_004
      description: '''Create Sourcing Requisition'' button is present on the Browse Requisitions page'
      type: existence
      expected: the Browse Requisitions page shows 'Create Sourcing Requisition', 'Browse Goods Catalog', and 'Browse Master
        Agreements' as navigation options
      depends_on:
      - step_003
  - id: tc_002
    goal: Verify the Create Requisition form opens with correct default values
    depends_on:
    - tc_001
    execution:
      navigation: Browse Requisitions
    steps:
    - id: step_005
      description: Create Requisition form opens after clicking the button
      type: transition
      expected: clicking 'Create Sourcing Requisition' opens a form with the page title 'Create Requisition' and a Requisition
        Header section visible
    - id: step_006
      description: Status defaults to Draft and is read-only
      type: value
      expected: on the open Create Requisition form, confirm the Status field shows 'Draft' and cannot be edited
      depends_on:
      - step_005
    - id: step_007
      description: Type defaults to Sourcing and is read-only
      type: value
      expected: on the open Create Requisition form, confirm the Type field shows 'Sourcing' and cannot be edited
      depends_on:
      - step_005
    - id: step_008
      description: Requestor is pre-filled with the logged-in user
      type: value
      expected: on the open Create Requisition form, confirm the Requestor field is pre-filled with a non-empty value (the
        currently logged-in user)
      depends_on:
      - step_005
  - id: tc_003
    goal: Verify the five mandatory fields on the empty Create Requisition form and validation behaviour
    depends_on:
    - tc_002
    execution:
      navigation: Browse Requisitions
    steps:
    - id: step_009
      description: Label is a mandatory field on the empty form
      type: existence
      expected: on the Create Requisition form, a field labelled 'Label' marked with an asterisk (*) is visible in the Requisition
        Header section
    - id: step_010
      description: Requesting Agency is a mandatory field on the empty form
      type: existence
      expected: on the open Create Requisition form, confirm a field labelled 'Requesting Agency' marked with an asterisk
        (*) is visible as a dropdown
      depends_on:
      - step_009
    - id: step_011
      description: Anticipated Contract Period start and end dates are mandatory on the empty form
      type: existence
      expected: on the open Create Requisition form, confirm two date fields for 'Anticipated Contract Period' are both marked
        as mandatory (asterisk)
      depends_on:
      - step_009
    - id: step_012
      description: Procurement Description / Executive Summary text area is mandatory on the empty form
      type: existence
      expected: on the open Create Requisition form, confirm a mandatory text area in the 'Procurement Description and Executive
        Summary' section is visible on the right panel
      depends_on:
      - step_009
    - id: step_013
      description: Clicking Save with no fields filled shows validation errors for all five mandatory fields
      type: constraint
      expected: 'saving the empty form triggers validation errors for: ''Label must have a value'', ''Requesting Agency must
        have a value'', two date errors ''must have a value (Expected date format: M/d/yyyy)'', and ''Executive Summary must
        have a value''. The form is not submitted.'
      depends_on:
      - step_009
  - id: tc_004
    goal: 'Verify cascading conditional fields: Agency → Division → Contract Type → Funding Type'
    depends_on:
    - tc_003
    execution:
      navigation: Browse Requisitions
    steps:
    - id: step_014
      description: Division field is not visible before Requesting Agency is selected
      type: existence
      expected: on the empty Create Requisition form, no 'Division' field is visible before any Requesting Agency is chosen
    - id: step_015
      description: Requesting Agency can be selected and shows the chosen value
      type: behavioral
      expected: the Requesting Agency field shows the selected agency name as a non-empty value
      data:
        requesting_agency: '{{requesting_agency}}'
      depends_on:
      - step_014
    - id: step_016
      description: Division field appears as mandatory after Requesting Agency is selected
      type: existence
      expected: a field labelled 'Division' marked with an asterisk (*) is visible on the form
      depends_on:
      - step_015
    - id: step_017
      description: Division field accepts a selection
      type: behavioral
      expected: the Division field shows the selected division value
      data:
        division: '{{division}}'
      depends_on:
      - step_016
    - id: step_018
      description: Contract Type can be selected
      type: behavioral
      expected: the Contract Type field shows the selected contract type
      data:
        contract_type: '{{contract_type}}'
      depends_on:
      - step_017
    - id: step_019
      description: Funding Type field appears as mandatory after Contract Type = General Contract (CT1) is selected
      type: existence
      expected: a 'Funding Type' field marked with an asterisk (*) is visible after Contract Type is set to General Contract
        (CT1)
      depends_on:
      - step_018
  - id: tc_005
    goal: Fill remaining mandatory fields on the open form and save, verify REQ number assigned
    depends_on:
    - tc_004
    execution:
      navigation: Browse Requisitions
    steps:
    - id: step_020
      description: Label field accepts a value on the open Create Requisition form
      type: behavioral
      expected: the Label field shows the entered label value
      data:
        label: '{{label}}'
    - id: step_021
      description: Anticipated Contract Period dates are filled
      type: behavioral
      expected: both Anticipated Contract Period date fields show the entered date values
      data:
        contract_period_start: '{{contract_period_start}}'
        contract_period_end: '{{contract_period_end}}'
      depends_on:
      - step_020
    - id: step_022
      description: Funding Type field accepts a selection
      type: behavioral
      expected: the Funding Type field shows the selected funding type
      data:
        funding_type: '{{funding_type}}'
      depends_on:
      - step_021
    - id: step_023
      description: Procurement Description text area accepts input
      type: behavioral
      expected: the Procurement Description / Executive Summary text area shows the entered text
      data:
        procurement_description: '{{procurement_description}}'
      depends_on:
      - step_022
    - id: step_024
      description: Saving a fully filled requisition assigns a unique REQ number in the page title
      type: transition
      expected: 'after saving the form, the page title shows ''Requisition: REQxxxxxx - <label> (Draft)'' with a unique REQ
        number, and both ''Cancel requisition'' and ''Duplicate Req.'' buttons are visible'
      depends_on:
      - step_023
  - id: tc_006
    goal: Verify PMQ section, select Emergency procurement method, answer all conditional questions, save
    depends_on:
    - tc_005
    execution:
      navigation: Manage Requisition
    steps:
    - id: step_025
      description: Procurement Method Questionnaire section is visible on the saved requisition
      type: existence
      expected: the Procurement Method Questionnaire section is visible on the saved requisition, containing an Estimated
        Total Cost field and a PM Req field
    - id: step_026
      description: Procurement Method combobox exists in the PMQ section
      type: existence
      expected: a 'Procurement Method' combobox or dropdown field is visible in the 'Select the Procurement Method Below'
        section
      depends_on:
      - step_025
    - id: step_027
      description: Selecting Emergency as Procurement Method triggers three conditional questions
      type: behavioral
      expected: the Procurement Method field shows the selected procurement method value
      data:
        procurement_method: '{{procurement_method}}'
      depends_on:
      - step_026
    - id: step_028
      description: Answer Yes to the emergency danger question
      type: behavioral
      expected: the question 'Was an Emergency procurement declared due to unforeseen danger to life, safety, property, or
        a necessary service?' shows 'Yes' as the selected answer
      depends_on:
      - step_027
    - id: step_029
      description: Select the Vendor using typeahead search
      type: behavioral
      expected: the Vendor field shows the selected vendor name
      data:
        vendor_search: '{{vendor_search}}'
      depends_on:
      - step_028
    - id: step_030
      description: Answer Yes to the accelerated procurement question
      type: behavioral
      expected: the Yes/No question about accelerated procurement for commodities subject to significant shortages and/or
        short-term price fluctuations shows 'Yes' as the selected answer
      depends_on:
      - step_029
    - id: step_031
      description: Save the PMQ form
      type: behavioral
      expected: saving the PMQ form succeeds and the page reloads without validation errors
      depends_on:
      - step_030
    - id: step_032
      description: '''Change Procurement Method'' button is visible after saving the PMQ'
      type: existence
      expected: a 'Change Procurement Method' button is visible on the page
      depends_on:
      - step_031
